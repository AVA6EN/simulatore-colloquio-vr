# Impostazioni generali della harness.
# Per override locali (es. modello diverso per prove) crea settings.local.yaml
# nella stessa cartella: è escluso da git.

# Fornitore del modello linguistico: gemini | anthropic
# La chiave si legge da GEMINI_API_KEY (o ANTHROPIC_API_KEY) oppure dal file harness/.env.
provider: gemini

# Modello. Gemini: gemini-3.8-flash (stabile), gemini-4-hydrogen (veloce, nuova generazione),
# gemini-3.5-flash-lite (il più economico). Anthropic: claude-opus-5-5.
model: gemini-3.8-flash

# Quanto il modello "ragiona" prima di rispondere (low | medium | high | xhigh).
# Battute del recruiter: "low" per tenere bassa la latenza durante il dialogo.
# Feedback finale: più alto, perché deve essere accurato e motivato.
# Attenzione: gemini-3.8-flash accetta solo low, medium, high.
turn_effort: low
feedback_effort: high

turn_max_tokens: 2000
feedback_max_tokens: 8000

# Quante volte la harness richiede una nuova battuta se l'output viola le regole
# (vedi guardrails.yaml) prima di usare la battuta di riserva.
max_guard_retries: 2

# Lingua del colloquio
language: it
