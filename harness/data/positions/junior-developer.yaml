id: junior-developer
title: Junior Web Developer
company: Nexa Digital (azienda fittizia)
sector: informatica
description: |
  Nexa Digital è una software house di Torino con 40 persone che sviluppa
  applicazioni web e mobile per clienti del settore retail e turismo.

  Cerchiamo un/una Junior Web Developer da inserire nel team frontend.
  Attività: sviluppo di interfacce in React, integrazione con API REST,
  correzione di bug, partecipazione alle code review e alle riunioni agile.

  Requisiti: JavaScript/TypeScript, React, Git, basi di HTTP e API REST.
  Graditi: Node.js, test automatici, esperienza in progetti di gruppo.
  Soft skill: lavoro in team, voglia di imparare, comunicazione chiara.

  Offriamo: contratto di apprendistato, affiancamento con un mentor, lavoro ibrido.
