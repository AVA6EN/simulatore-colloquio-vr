id: junior-3d-artist
title: Junior 3D Artist
company: Pixel Forge Studio (azienda fittizia)
sector: grafica-3d-xr
description: |
  Pixel Forge Studio realizza esperienze in realtà virtuale e aumentata per musei,
  fiere e formazione aziendale.

  Cerchiamo un/una Junior 3D Artist per modellazione, texturing e ottimizzazione
  di asset da usare in Unity su visori VR.

  Requisiti: Blender o software equivalente, texturing PBR, conoscenza di base di
  Unity, attenzione all'ottimizzazione (poligoni, draw call). Portfolio obbligatorio.
  Graditi: rigging, animazione, Substance Painter.
  Soft skill: gestione delle scadenze, capacità di accettare feedback, lavoro in team.

  Offriamo: contratto a tempo determinato di 12 mesi con possibilità di rinnovo.
